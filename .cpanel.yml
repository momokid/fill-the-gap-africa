---
# cPanel Git Version Control deployment tasks.
#
# cPanel installs a post-receive hook on its managed repository, so every push
# from GitHub Actions runs this file. Only application code is copied: the live
# .env, data/ and public/uploads/ are never overwritten or deleted.
#
# APP_NAME is the Node.js application root relative to the cPanel home folder.
# It must match the folder used in cPanel > Setup Node.js App, because cPanel
# creates the virtualenv at ~/nodevenv/<APP_NAME>/<version>.
deployment:
  tasks:
    - export APP_NAME="fillthegap-africa-site"
    - export DEPLOYPATH="$HOME/$APP_NAME"
    - export REPO_ROOT="$PWD"

    # The app root and its writable folders must exist before the first copy.
    - /bin/mkdir -p "$DEPLOYPATH/data" "$DEPLOYPATH/public/uploads" "$DEPLOYPATH/tmp"

    # Code directories: remove then copy, so files deleted from Git disappear.
    # Plain cp is used because some cPanel hosts (including this one) lack rsync.
    - /bin/rm -rf "$DEPLOYPATH/lib" && /bin/cp -R "$REPO_ROOT/lib" "$DEPLOYPATH/lib"
    - /bin/rm -rf "$DEPLOYPATH/routes" && /bin/cp -R "$REPO_ROOT/routes" "$DEPLOYPATH/routes"
    - /bin/rm -rf "$DEPLOYPATH/views" && /bin/cp -R "$REPO_ROOT/views" "$DEPLOYPATH/views"
    - /bin/rm -rf "$DEPLOYPATH/scripts" && /bin/cp -R "$REPO_ROOT/scripts" "$DEPLOYPATH/scripts"
    - /bin/rm -rf "$DEPLOYPATH/public/css" && /bin/cp -R "$REPO_ROOT/public/css" "$DEPLOYPATH/public/css"
    - /bin/rm -rf "$DEPLOYPATH/public/js" && /bin/cp -R "$REPO_ROOT/public/js" "$DEPLOYPATH/public/js"
    - /bin/rm -rf "$DEPLOYPATH/public/img" && /bin/cp -R "$REPO_ROOT/public/img" "$DEPLOYPATH/public/img"

    # Top-level code files. .env is deliberately absent.
    - /bin/cp "$REPO_ROOT/app.js" "$REPO_ROOT/config.js" "$REPO_ROOT/package.json" "$REPO_ROOT/package-lock.json" "$REPO_ROOT/.env.example" "$DEPLOYPATH/"

    # Install production dependencies inside the cPanel Node.js virtualenv.
    - 'export NODEVENV="$(ls -d "$HOME"/nodevenv/"$APP_NAME"/*/bin/activate 2>/dev/null | sort -V | tail -n 1)"'
    - 'if [ -z "$NODEVENV" ]; then echo "No cPanel Node.js virtualenv at ~/nodevenv/$APP_NAME"; exit 1; fi'
    - '. "$NODEVENV" && cd "$DEPLOYPATH" && npm ci --omit=dev --no-audit --no-fund'

    # data/ and public/uploads/ are written by the app, not by the deploy.
    - /bin/chmod -R u+rwX "$DEPLOYPATH/data" "$DEPLOYPATH/public/uploads"

    # Passenger restarts the app when this timestamp changes.
    - /usr/bin/touch "$DEPLOYPATH/tmp/restart.txt"
